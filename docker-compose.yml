services:
  postgres:
    image: postgres:16-alpine
    container_name: web3-tickets-postgres
    environment:
      POSTGRES_USER: web3_tickets
      POSTGRES_PASSWORD: web3_tickets
      POSTGRES_DB: web3_tickets
    ports:
      - "5433:5432"
    volumes:
      - web3_tickets_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U web3_tickets -d web3_tickets"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    container_name: web3-tickets-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  web3_tickets_pgdata:
